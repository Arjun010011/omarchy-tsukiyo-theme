# Tsukiyo: parchment on night ink. Normal and bright rows sit one small step apart.
# [window] must precede the [colors.*] tables, or alacritty reads its keys as colors.*.
[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
opacity = 0.92
blur = true

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600
blink_timeout = 15
thickness = 0.12

[colors.primary]
background = "#121820"
foreground = "#c8c4bb"
bright_foreground = "#d8d4cc"

[colors.cursor]
text = "#121820"
cursor = "#c8c4bb"

[colors.vi_mode_cursor]
text = "#121820"
cursor = "#88a4ad"

[colors.search.matches]
foreground = "#121820"
background = "#7a98ab"

[colors.search.focused_match]
foreground = "#121820"
background = "#c4b48a"

[colors.footer_bar]
foreground = "#c8c4bb"
background = "#1a222b"

[colors.selection]
text = "#d8d4cc"
background = "#243039"

[colors.normal]
black = "#1a222b"
red = "#b37a72"
green = "#8ca483"
yellow = "#c4b48a"
blue = "#7a98ab"
magenta = "#9c8898"
cyan = "#7fa3a3"
white = "#b3b0a8"

[colors.bright]
black = "#4a5a63"
red = "#c08880"
green = "#9ab191"
yellow = "#d0c19a"
blue = "#89a6b8"
magenta = "#aa97a6"
cyan = "#8eb0b0"
white = "#d8d4cc"
