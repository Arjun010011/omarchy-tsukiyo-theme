# Tsukiyo for tmux. Source it from your tmux.conf:
#   source-file ~/.config/tmux/tsukiyo.conf

set -g status-position bottom
set -g status-style "bg=default,fg=#6a7175"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#88a4ad]#S #[fg=#28323a]│ "
set -g status-right "#{?client_prefix,#[fg=#c4b48a]prefix  ,}#[fg=#4a5a63]%H:%M"

set -g window-status-format "#[fg=#4a5a63]#I #[fg=#6a7175]#W"
set -g window-status-current-format "#[fg=#88a4ad]#I #[fg=#c8c4bb]#W"
set -g window-status-separator "   "
set -g window-status-activity-style "fg=#c4b48a"
set -g window-status-bell-style "fg=#b37a72"

set -g pane-border-lines single
set -g pane-border-style "fg=#1a222b"
set -g pane-active-border-style "fg=#4a5a63"

set -g message-style "bg=#1a222b,fg=#c8c4bb"
set -g message-command-style "bg=#1a222b,fg=#88a4ad"
set -g mode-style "bg=#243039,fg=#d8d4cc"
set -g copy-mode-match-style "bg=#2b3a44,fg=#c8c4bb"
set -g copy-mode-current-match-style "bg=#88a4ad,fg=#121820"

set -g clock-mode-colour "#88a4ad"
set -g clock-mode-style 24
