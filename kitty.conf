# Tsukiyo: parchment on night ink. Normal and bright rows sit one small step apart.
foreground #c8c4bb
background #121820
selection_foreground #d8d4cc
selection_background #243039
url_color #7fa3a3

cursor #c8c4bb
cursor_text_color #121820

# Beam cursor that breathes, and a faint trail that follows long jumps
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 15
cursor_trail 3
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 3
cursor_trail_color #4a5a63

active_border_color #88a4ad
inactive_border_color #1a222b
bell_border_color #c4b48a
active_tab_foreground #121820
active_tab_background #88a4ad
inactive_tab_foreground #6a7175
inactive_tab_background #0e1319
tab_bar_background #0e1319
tab_bar_style powerline
tab_powerline_style slanted

color0 #1a222b
color1 #b37a72
color2 #8ca483
color3 #c4b48a
color4 #7a98ab
color5 #9c8898
color6 #7fa3a3
color7 #b3b0a8
color8 #4a5a63
color9 #c08880
color10 #9ab191
color11 #d0c19a
color12 #89a6b8
color13 #aa97a6
color14 #8eb0b0
color15 #d8d4cc

window_padding_width 10
background_opacity 0.92
background_blur 20
